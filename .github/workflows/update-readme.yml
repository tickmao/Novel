name: 更新书源数量和README

on:
  schedule:
    # 每天凌晨1点UTC执行
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: '强制更新README'
        required: false
        default: 'false'
        type: boolean

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 统计书源数量并更新README
      run: |
        cd scripts
        python3 update_readme.py --base-dir ..

    - name: 检查是否有更改
      id: check_changes
      run: |
        if git diff --quiet README.md; then
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "没有检测到README更改"
        else
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "检测到README更改"
        fi

    - name: 提交更改
      if: steps.check_changes.outputs.has_changes == 'true' || github.event.inputs.force_update == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # 获取当前书源数量
        LEGADO_COUNT=$(python3 -c "
        import json
        from pathlib import Path
        try:
            with open('sources/legado/full.json', 'r', encoding='utf-8') as f:
                sources = json.load(f)
                print(len(sources))
        except:
            print('0')
        ")

        # 提交更改
        git add README.md STATS.md 2>/dev/null || git add README.md
        git commit -m "docs: 自动更新书源数量

        - 阅读书源: ${LEGADO_COUNT} 个
        - 更新时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
        - 自动化更新: GitHub Actions"

        git push

    - name: 生成更新报告
      if: steps.check_changes.outputs.has_changes == 'true'
      run: |
        echo "## 📊 书源数量更新报告" > update_report.md
        echo "" >> update_report.md
        echo "**更新时间**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> update_report.md
        echo "" >> update_report.md

        # 运行统计脚本获取详细信息
        cd scripts
        python3 update_readme.py --dry-run --base-dir .. >> ../update_report.md

        echo "" >> ../update_report.md
        echo "README.md 已自动更新书源数量信息。" >> ../update_report.md

    - name: 上传更新报告
      if: steps.check_changes.outputs.has_changes == 'true'
      uses: actions/upload-artifact@v3
      with:
        name: update-report
        path: update_report.md

  # 可选：同时触发书源补充系统
  trigger-supplement:
    runs-on: ubuntu-latest
    needs: update-readme
    if: github.event.schedule == '0 1 * * *'  # 只在定时任务时触发

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install aiohttp aiofiles

    - name: 执行健康检查
      run: |
        cd scripts
        python3 health_monitor.py --check-supplement

        # 如果需要补充，触发补充流程
        if [ $? -eq 1 ]; then
          echo "检测到书源数量不足，触发自动补充..."
          python3 auto_supplement.py --target 1000
        fi
name: Maintain Sources

on:
  schedule:
    - cron: '0 18 * * *'
    - cron: '0 0,6,12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [daily, catchup, backfill]
        default: catchup
      dry_run:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
      batch_size:
        description: Maximum candidate revisions to check
        type: number
        default: 500
      max_minutes:
        description: Maintenance time budget
        type: number
        default: 30

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: source-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: github.ref_type == 'branch' && (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    outputs:
      published: ${{ steps.maintenance.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Run offline regression tests
        run: python -B -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v3
      - name: Build the pinned runtime
        id: runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/Dockerfile
          load: true
          tags: novel-runtime:ci
          cache-from: type=gha,scope=novel-runtime
          cache-to: type=gha,mode=max,scope=novel-runtime
      - name: Initialize the raw store
        if: inputs.dry_run != true
        run: python scripts/source_inventory.py migrate
      - name: Verify runtime compatibility
        env:
          NOVEL_ENGINE_IMAGE: ${{ steps.runtime.outputs.imageid }}
        run: |
          python -B scripts/probe_runtime.py fixtures
          python -B scripts/probe_runtime.py sample --count 60 --max-minutes 15
          python -B scripts/probe_runtime.py gate --container-digest "$NOVEL_ENGINE_IMAGE"
      - name: Maintain inventory
        id: maintenance
        env:
          NOVEL_ENGINE_IMAGE: ${{ steps.runtime.outputs.imageid }}
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DRY_RUN: ${{ inputs.dry_run }}
          REQUESTED_BATCH: ${{ inputs.batch_size }}
          REQUESTED_MINUTES: ${{ inputs.max_minutes }}
          PUBLISH: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || inputs.publish) }}
        run: |
          MODE="${REQUESTED_MODE:-daily}"
          if [ "$EVENT_SCHEDULE" = '0 0,6,12 * * *' ]; then MODE=catchup; fi
          BATCH=300
          if [ "$MODE" = catchup ]; then BATCH=1000; fi
          BATCH="${REQUESTED_BATCH:-$BATCH}"
          MINUTES="${REQUESTED_MINUTES:-60}"
          FLAGS=()
          if [ "$DRY_RUN" = true ]; then
            FLAGS+=(--dry-run)
          elif [ "$PUBLISH" = true ]; then
            FLAGS+=(--publish)
          fi
          python -B scripts/daily_maintenance.py --mode "$MODE" --batch-size "$BATCH" --max-minutes "$MINUTES" "${FLAGS[@]}"
      - name: Verify the publication
        id: verify
        env:
          PUBLISHED: ${{ steps.maintenance.outputs.published }}
        run: |
          FLAGS=()
          if [ "$PUBLISHED" = true ]; then FLAGS+=(--current-health); fi
          python -B scripts/check_publication.py --allow-bootstrap "${FLAGS[@]}"
      - name: Persist completed work
        if: ${{ always() && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.maintenance.outputs.published }}
          VERIFIED: ${{ steps.verify.outcome == 'success' }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          for path in sources/legado/pool/raw/ reports/runtime/; do
            if [ -d "$path" ]; then git add "$path"; fi
          done
          for file in sources/legado/main/shadow.json sources/legado/main/maintenance_report.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if [ "$PUBLISHED" = true ] && [ "$VERIFIED" = true ]; then
            git add sources/legado/main/ sources/legado/full.json sources/legado/pool/candidates.json README.md STATS.md docs/
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: maintain source inventory and publication'
          git push origin "HEAD:$TARGET_BRANCH"
      - name: Preserve recovery data
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-recovery-${{ github.run_id }}
          retention-days: 14
          path: |
            sources/legado/pool/raw/
            sources/legado/main/maintenance_report.json
            sources/legado/main/shadow.json
            reports/runtime/
      - name: Add run summary
        if: ${{ always() }}
        run: |
          python scripts/check_publication.py --summary --allow-bootstrap >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path('sources/legado/main/maintenance_report.json')
          if path.exists():
              report = json.loads(path.read_text())
              progress = report.get('raw_progress', {})
              print('\n## Raw inventory validation\n')
              for key in ('raw_sources', 'eligible_revisions', 'attempted_revisions', 'pending_revisions'):
                  print(f'- {key}: {progress.get(key, "unknown")}')
              print(f'- healthy_sources: {report.get("inventory", {}).get("healthy_count", 0)}')
              print(f'- collection: {report.get("collection_decision", {}).get("reason", "unknown")}')
          PY

  deploy:
    needs: maintain
    if: needs.maintain.outputs.published == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment

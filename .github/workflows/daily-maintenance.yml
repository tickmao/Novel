name: Maintain Sources

on:
  schedule:
    - cron: '0 18 * * *'
    - cron: '0 0,6,12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [daily, catchup, backfill]
        default: catchup
      dry_run:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
      batch_size:
        description: Maximum candidate revisions to check (empty uses the deficit-driven plan)
      max_minutes:
        description: Maintenance time budget
        type: number
        default: 30

permissions:
  contents: write
  issues: write

concurrency:
  group: source-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: github.ref_type == 'branch' && (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # github.event.schedule exists only for schedule events, so every step derives
    # the mode from this one value instead of repeating the rule in shell.
    env:
      MAINTENANCE_MODE: ${{ github.event.schedule == '0 0,6,12 * * *' && 'catchup' || 'daily' }}
    outputs:
      published: ${{ steps.maintenance.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Run offline regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Check outbound connectivity
        run: python -B scripts/network_selfcheck.py
      - uses: docker/setup-buildx-action@v3
      - name: Build the pinned runtime
        id: runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/Dockerfile
          load: true
          tags: novel-runtime:ci
          cache-from: type=gha,scope=novel-runtime
          cache-to: type=gha,mode=max,scope=novel-runtime
      - name: Initialize the raw store
        if: inputs.dry_run != true
        run: python scripts/source_inventory.py migrate
      - name: Verify the engine fixtures
        env:
          NOVEL_ENGINE_IMAGE: ${{ steps.runtime.outputs.imageid }}
        run: python -B scripts/probe_runtime.py fixtures
      - name: Sample live sources
        continue-on-error: true
        env:
          NOVEL_ENGINE_IMAGE: ${{ steps.runtime.outputs.imageid }}
        run: python -B scripts/probe_runtime.py sample --count 60 --max-minutes 15
      - name: Record runtime compatibility
        env:
          NOVEL_ENGINE_IMAGE: ${{ steps.runtime.outputs.imageid }}
          REQUIRE_READY: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          FLAGS=()
          if [ "$REQUIRE_READY" = 'true' ]; then FLAGS+=(--require-ready); fi
          python -B scripts/probe_runtime.py gate --container-digest "$NOVEL_ENGINE_IMAGE" "${FLAGS[@]}"
      - name: Plan this run
        run: python -B scripts/maintenance_plan.py --explain --mode "$MAINTENANCE_MODE" >> "$GITHUB_STEP_SUMMARY"
      - name: Maintain inventory
        id: maintenance
        env:
          NOVEL_ENGINE_IMAGE: ${{ steps.runtime.outputs.imageid }}
          MODE: ${{ inputs.mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          REQUESTED_BATCH: ${{ inputs.batch_size }}
          REQUESTED_MINUTES: ${{ inputs.max_minutes }}
          PUBLISH: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || inputs.publish) }}
        run: |
          # MAINTENANCE_MODE comes from the job env, which every step inherits;
          # an explicit dispatch input wins when the user picked one.
          MODE="${MODE:-$MAINTENANCE_MODE}"
          MINUTES="${REQUESTED_MINUTES:-60}"
          FLAGS=()
          if [ "$DRY_RUN" = true ]; then
            FLAGS+=(--dry-run)
          elif [ "$PUBLISH" = true ]; then
            FLAGS+=(--publish)
          fi
          BATCH_FLAGS=()
          if [ -n "$REQUESTED_BATCH" ]; then
            BATCH_FLAGS+=(--batch-size "$REQUESTED_BATCH")
          fi
          python -B scripts/daily_maintenance.py --mode "$MODE" --max-minutes "$MINUTES" \
            "${BATCH_FLAGS[@]}" "${FLAGS[@]}"
      - name: Verify the publication
        id: verify
        if: steps.maintenance.outputs.published == 'true'
        run: python -B scripts/check_publication.py --allow-bootstrap
      - name: Persist completed work
        if: ${{ always() && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.maintenance.outputs.published }}
          VERIFIED: ${{ steps.verify.outcome == 'success' }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          for path in sources/legado/pool/raw/ reports/runtime/; do
            if [ -d "$path" ]; then git add "$path"; fi
          done
          for file in sources/legado/main/shadow.json sources/legado/main/maintenance_report.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if [ "$PUBLISHED" = true ] && [ "$VERIFIED" = true ]; then
            for file in \
              sources/legado/main/full.json \
              sources/legado/main/full-extended.json \
              sources/legado/main/publication.json \
              sources/legado/main/metadata.json \
              sources/legado/main/working.json \
              sources/legado/manifest.json \
              sources/legado/full.json \
              sources/legado/full-extended.json \
              sources/legado/pool/candidates.json \
              README.md STATS.md docs/; do
              if [ -e "$file" ]; then git add "$file"; fi
            done
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: maintain source inventory and publication'
          for delay in 5 15 30; do
            if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
            git pull --rebase --autostash origin "$TARGET_BRANCH" || git rebase --abort || true
            sleep "$delay"
          done
          echo '::error::Could not push the maintenance commit after four attempts'
          git status --short
          exit 1
      - name: Preserve recovery data
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-recovery-${{ github.run_id }}
          retention-days: 14
          path: |
            sources/legado/pool/raw/
            sources/legado/main/maintenance_report.json
            sources/legado/main/shadow.json
            reports/runtime/
            reports/maintenance/
      - name: Add run summary
        if: ${{ always() }}
        continue-on-error: true
        run: python -B scripts/check_publication.py --summary --allow-bootstrap >> "$GITHUB_STEP_SUMMARY"
      - name: Sync the health issue
        if: ${{ always() && inputs.dry_run != true }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/ops_alert.py --repo "${{ github.repository }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"


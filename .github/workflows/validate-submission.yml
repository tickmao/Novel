name: Check Submission Format

on:
  pull_request:
    paths: ['sources/legado/submissions/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - run: python -B scripts/submissions.py --directory sources/legado/submissions
      - run: echo 'Format validation only. Merged submissions enter the normal content and reading checks.' >> "$GITHUB_STEP_SUMMARY"

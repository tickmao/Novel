name: Check Source Pipeline

on:
  push:
    paths: ['scripts/**', 'tests/**', 'config/**', '.github/workflows/**']
  pull_request:
    paths: ['scripts/**', 'tests/**', 'config/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python scripts/check_publication.py --allow-bootstrap
